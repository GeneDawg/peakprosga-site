<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Measurement check · admin</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}input{padding:8px;width:100%;box-sizing:border-box;margin:8px 0}button{padding:10px 18px;background:#C8102E;color:#fff;border:0;border-radius:6px;font-weight:600}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}</style></head>
<body><h1>Measurement check</h1>
<p>Admin only. Read-only: shows which measurement fields JobNimbus returns for a job. Sign in at <a href="/partners/">/partners/</a> first, then open this page in the same tab.</p>
<label for="j">JobNimbus job id</label><input id="j" autocomplete="off"><button id="go" type="button">Check</button> <button id="pr" type="button">Show price-list items</button>
<pre id="out"></pre>
<script>
document.getElementById("go").onclick = async () => {
  const out = document.getElementById("out");
  let s = null; try { s = JSON.parse(sessionStorage.getItem("p3p_portal") || "null"); } catch (e) {}
  if (!s || !s.token) { out.textContent = "Not signed in. Open /partners/, sign in as admin, then come back here in the same tab."; return; }
  const id = document.getElementById("j").value.trim();
  if (!id) { out.textContent = "Enter a job id."; return; }
  out.textContent = "Checking...";
  try {
    const r = await fetch("/api/portal/measure-test?job=" + encodeURIComponent(id), { headers: { authorization: "Bearer " + s.token } });
    const j = await r.json();
    out.textContent = "HTTP " + r.status + "\n" + JSON.stringify(j, null, 2);
  } catch (e) { out.textContent = "Error: " + e.message; }
};
document.getElementById("pr").onclick = async () => {
  const out = document.getElementById("out");
  let s = null; try { s = JSON.parse(sessionStorage.getItem("p3p_portal") || "null"); } catch (e) {}
  if (!s || !s.token) { out.textContent = "Not signed in."; return; }
  out.textContent = "Loading...";
  try { const r = await fetch("/api/portal/measure-test?products=1", { headers: { authorization: "Bearer " + s.token } }); out.textContent = "HTTP " + r.status + "\n" + JSON.stringify(await r.json(), null, 2); } catch (e) { out.textContent = "Error: " + e.message; }
};
</script></body></html>
