[build]
  publish = "."

[functions]
  node_bundler = "esbuild"

# Partner areas: never indexed by search engines, never framed by other sites, never cached,
# and no full URL (with signed file links) leaked to other sites.
[[headers]]
  for = "/partners/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# Partner portal on its own address: partners.peakprosga.com opens the sign-in/dashboard,
# and /submit opens the job form. (Active once the partners subdomain is added to this Netlify site.)
[[redirects]]
  from = "https://partners.peakprosga.com/"
  to = "/partners/"
  status = 200
  force = true

[[redirects]]
  from = "https://partners.peakprosga.com/submit"
  to = "/login.html"
  status = 200
  force = true

# National dashboard (Peak 301 Pros leadership): never indexed, never framed, never cached.
[[headers]]
  for = "/national/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
